server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-users
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
        - id: tuition-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/tuitions/**
        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/payments/**

app:
  jwt:
    secret: aVeryLongSecretKeyForJwtAuthenticationWhichShouldBeKeptSafe
